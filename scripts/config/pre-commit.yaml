repos:
  - repo: local
    hooks:
      - id: scan-secrets
        name: Scan secrets
        entry: make scan-secrets check=whole-history
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: check-file-format
        name: Check file format
        entry: make lint-file-format check=all
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: check-markdown-format
        name: Check Markdown format
        entry: make lint-markdown-format check=all
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: check-markdown-links
        name: Check Markdown links
        entry: make lint-markdown-links check=all
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: check-shell-lint
        name: Check shell scripts
        entry: make lint-shell check=all
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: check-workflow-security
        name: Check workflow security
        entry: make lint-workflow-security check=all
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: check-pipeline-contract
        name: Check pipeline contract
        entry: make lint-pipeline-contract check=all
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: test
        name: Run tests
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
