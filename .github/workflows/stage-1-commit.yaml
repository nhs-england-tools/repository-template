name: "🔍 Commit stage"

on:
  workflow_call:
    inputs:
      build_datetime_london:
        description: "London build datetime, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_datetime:
        description: "Build datetime, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_epoch:
        description: "Build epoch, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_timestamp:
        description: "Build timestamp, set by the CI/CD pipeline workflow"
        required: true
        type: string
      mise_version:
        description: "mise CLI version, set by the CI/CD pipeline workflow"
        required: true
        type: string
      nodejs_version:
        description: "Node.js version, set by the CI/CD pipeline workflow"
        required: true
        type: string
      python_version:
        description: "Python version, set by the CI/CD pipeline workflow"
        required: true
        type: string
      version:
        description: "Version of the software, set by the CI/CD pipeline workflow"
        required: true
        type: string

permissions: {}

jobs:
  scan-secrets:
    name: "🔐 Scan secrets"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to scan all commits
          persist-credentials: false
      - name: "🔐 Scan secrets"
        uses: ./.github/actions/scan-secrets
  check-file-format:
    name: "📐 Check file format"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
          persist-credentials: false
      - name: "📐 Check file format"
        uses: ./.github/actions/check-file-format
  check-markdown-format:
    name: "📝 Check Markdown format"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
          persist-credentials: false
      - name: "📝 Check Markdown format"
        uses: ./.github/actions/check-markdown-format
  check-markdown-links:
    name: "🔗 Check Markdown links"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
          persist-credentials: false
      - name: "🔗 Check Markdown links"
        uses: ./.github/actions/check-markdown-links
  check-shell-lint:
    name: "🐚 Check shell scripts"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🐚 Check shell scripts"
        uses: ./.github/actions/check-shell-lint
  check-workflow-security:
    name: "🔒 Check workflow security"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🧰 Set up mise"
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ inputs.mise_version }}
          install: true
          install_args: "yq jq"
          persist_github_token: false
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🔒 Check workflow security"
        run: make lint-workflow-security check=all
  check-pipeline-contract:
    name: "📜 Check pipeline contract"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🧰 Set up mise"
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ inputs.mise_version }}
          install: true
          install_args: "yq jq"
          persist_github_token: false
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "📜 Check pipeline contract"
        run: make lint-pipeline-contract check=all
