name: "Commit stage"

on:
  workflow_call:
    inputs:
      build_datetime:
        description: "Build datetime, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_timestamp:
        description: "Build timestamp, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_epoch:
        description: "Build epoch, set by the CI/CD pipeline workflow"
        required: true
        type: string
      nodejs_version:
        description: "Node.js version, set by the CI/CD pipeline workflow"
        required: true
        type: string
      python_version:
        description: "Python version, set by the CI/CD pipeline workflow"
        required: true
        type: string
      version:
        description: "Version of the software, set by the CI/CD pipeline workflow"
        required: true
        type: string

permissions:
  contents: read

env:
  # Without a version, jdx/mise-action downloads the latest mise CLI release on every run
  TOOLCHAIN_MISE_VERSION: "2026.9.14"

jobs:
  scan-secrets:
    name: "Scan secrets"
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to scan all commits
      - name: "Set up mise"
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.TOOLCHAIN_MISE_VERSION }}
          install: true
          install_args: "gitleaks"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Scan secrets"
        uses: ./.github/actions/scan-secrets
  check-file-format:
    name: "Check file format"
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
      - name: "Set up mise"
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.TOOLCHAIN_MISE_VERSION }}
          install: true
          install_args: "editorconfig-checker"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Check file format"
        uses: ./.github/actions/check-file-format
  check-markdown-format:
    name: "Check Markdown format"
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
      - name: "Set up mise"
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.TOOLCHAIN_MISE_VERSION }}
          install: true
          install_args: "node npm:markdownlint-cli"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Check Markdown format"
        uses: ./.github/actions/check-markdown-format
  check-markdown-links:
    name: "Check Markdown links"
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
      - name: "Set up mise"
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.TOOLCHAIN_MISE_VERSION }}
          install: true
          install_args: "lychee"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Check Markdown links"
        uses: ./.github/actions/check-markdown-links
