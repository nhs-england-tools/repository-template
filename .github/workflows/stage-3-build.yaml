name: "🏗️ Build stage"

on:
  workflow_call:
    inputs:
      build_datetime_london:
        description: "London build datetime, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_datetime:
        description: "Build datetime, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_epoch:
        description: "Build epoch, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_timestamp:
        description: "Build timestamp, set by the CI/CD pipeline workflow"
        required: true
        type: string
      mise_version:
        description: "mise CLI version, set by the CI/CD pipeline workflow"
        required: true
        type: string
      nodejs_version:
        description: "Node.js version, set by the CI/CD pipeline workflow"
        required: true
        type: string
      python_version:
        description: "Python version, set by the CI/CD pipeline workflow"
        required: true
        type: string
      version:
        description: "Version of the software, set by the CI/CD pipeline workflow"
        required: true
        type: string

permissions: {}

jobs:
  artefact-1:
    name: "📦 Artefact 1"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 3
    env:
      BUILD_DATETIME_LONDON: ${{ inputs.build_datetime_london }}
      BUILD_DATETIME: ${{ inputs.build_datetime }}
      BUILD_EPOCH: ${{ inputs.build_epoch }}
      BUILD_TIMESTAMP: ${{ inputs.build_timestamp }}
      MISE_VERSION: ${{ inputs.mise_version }}
      NODEJS_VERSION: ${{ inputs.nodejs_version }}
      PYTHON_VERSION: ${{ inputs.python_version }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🧰 Set up mise"
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ inputs.mise_version }}
          install: true
          persist_github_token: false
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🔨 Build artefact 1"
        id: build
        run: |
          make build
      - name: "🔍 Check artefact 1"
        run: |
          echo "Checking artefact 1 ..."
      - name: "📤 Upload artefact 1"
        run: |
          echo "Uploading artefact 1 ..."
          # Template placeholder: choose the project's artifact handoff action.
  artefact-2:
    name: "📦 Artefact 2"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🔨 Build artefact 2"
        run: |
          echo "Building artefact 2 ..."
      - name: "🔍 Check artefact 2"
        run: |
          echo "Checking artefact 2 ..."
      - name: "📤 Upload artefact 2"
        run: |
          echo "Uploading artefact 2 ..."
          # Template placeholder: choose the project's artifact handoff action.
