name: "🚀 CI/CD deploy"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, for example v1.2.3"
        required: true

# Only one deployment runs at a time, and a running deployment is never
# cancelled. When another starts, GitHub cancels the one that is waiting.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  metadata:
    name: "🏷️ Set CI/CD metadata"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 1
    outputs:
      build_datetime_london: ${{ steps.variables.outputs.build_datetime_london }}
      build_datetime: ${{ steps.variables.outputs.build_datetime }}
      build_epoch: ${{ steps.variables.outputs.build_epoch }}
      build_timestamp: ${{ steps.variables.outputs.build_timestamp }}
      mise_version: ${{ steps.variables.outputs.mise_version }}
      nodejs_version: ${{ steps.variables.outputs.nodejs_version }}
      python_version: ${{ steps.variables.outputs.python_version }}
      version: ${{ steps.variables.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.variables.outputs.commit }}
    steps:
      - name: "🔖 Validate tag"
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git check-ref-format "refs/tags/$TAG" || { printf '::error::Invalid tag: %q\n' "${TAG//'%'/%25}"; exit 1; }
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Use a protected release tag such as v1.2.3"; exit 1; }
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: "🔧 Set CI/CD variables"
        id: variables
        run: |
          datetime=$(date -u +'%Y-%m-%dT%H:%M:%S%z')
          echo "build_datetime_london=$(TZ=Europe/London date --date=$datetime +'%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_OUTPUT"
          echo "build_datetime=$datetime" >> "$GITHUB_OUTPUT"
          echo "build_epoch=$(date --date=$datetime -u +'%s')" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date --date=$datetime -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          source scripts/docker/docker.lib.sh
          echo "mise_version=$(_toml-table-entry "" min_version mise.toml)" >> "$GITHUB_OUTPUT"
          echo "nodejs_version=$(_toml-table-entry tools node mise.toml)" >> "$GITHUB_OUTPUT"
          echo "python_version=$(_toml-table-entry tools python mise.toml)" >> "$GITHUB_OUTPUT"
          version="$(./scripts/cicd/read-repository-version.sh)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: "📋 List variables"
        env:
          BUILD_DATETIME_LONDON: ${{ steps.variables.outputs.build_datetime_london }}
          BUILD_DATETIME: ${{ steps.variables.outputs.build_datetime }}
          BUILD_EPOCH: ${{ steps.variables.outputs.build_epoch }}
          BUILD_TIMESTAMP: ${{ steps.variables.outputs.build_timestamp }}
          MISE_VERSION: ${{ steps.variables.outputs.mise_version }}
          NODEJS_VERSION: ${{ steps.variables.outputs.nodejs_version }}
          PYTHON_VERSION: ${{ steps.variables.outputs.python_version }}
          VERSION: ${{ steps.variables.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          make list-variables
  deploy:
    name: "🚀 Deploy to an environment"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    needs: [metadata]
    timeout-minutes: 10
    env:
      BUILD_DATETIME_LONDON: ${{ needs.metadata.outputs.build_datetime_london }}
      BUILD_DATETIME: ${{ needs.metadata.outputs.build_datetime }}
      BUILD_EPOCH: ${{ needs.metadata.outputs.build_epoch }}
      BUILD_TIMESTAMP: ${{ needs.metadata.outputs.build_timestamp }}
      MISE_VERSION: ${{ needs.metadata.outputs.mise_version }}
      NODEJS_VERSION: ${{ needs.metadata.outputs.nodejs_version }}
      PYTHON_VERSION: ${{ needs.metadata.outputs.python_version }}
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - name: "🧰 Set up mise"
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ needs.metadata.outputs.mise_version }}
          install: true
          persist_github_token: false
          cache: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🚀 Deploy project artefacts"
        id: deploy
        run: |
          make deploy
  # Report the outcome of every job in needs, including failures.
  notify:
    name: "📣 Notify pipeline status"
    permissions:
      actions: read
      contents: read
    needs: [metadata, deploy]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/notify-pipeline-status.yaml
    with:
      needs: ${{ toJSON(needs) }}
      commit: ${{ needs.metadata.outputs.tag }}
      details: |
        Tag: ${{ needs.metadata.outputs.tag }}
        Version: ${{ needs.metadata.outputs.version }}
      success_title: "DEPLOYED: ${{ needs.metadata.outputs.tag }}"
      success_text: "${{ needs.metadata.outputs.tag }} is deployed."
    secrets:
      TEAMS_NOTIFICATION_ALERTS_WEBHOOK_URL: ${{ secrets.TEAMS_NOTIFICATION_ALERTS_WEBHOOK_URL }}
      TEAMS_NOTIFICATION_UPDATES_WEBHOOK_URL: ${{ secrets.TEAMS_NOTIFICATION_UPDATES_WEBHOOK_URL }}
