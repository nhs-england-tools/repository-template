# See:
# - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
# - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
# - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/common-validation-errors-when-creating-issue-forms

name: 🔧 Support Request
description: Get help using this project
title: "[Support]: "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the help you need and what you have tried. Do not include sensitive information.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short summary of the help you need.
      placeholder: e.g. Unable to run make config on macOS
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe your goal and the outcome you want.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: Include commands, config changes, and references you followed.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Include the result you expected, what happened instead, and any useful steps or errors.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment and project version
      description: Add relevant details only. Redact credentials and do not include personal data or PII/PID.
      value: |
        - Project version or commit:
        - OS:
        - Tool versions:
        - Runtime:
      render: markdown
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant command output
      description: Optional. Redact credentials and do not include personal data or PII/PID. Output is formatted as code.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots that might help.
    validations:
      required: false
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the [Code of Conduct](https://github.com/nhs-england-tools/repository-template/blob/main/.github/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive information
      description: Please do not include credentials, PII/PID, or other sensitive data. See [NHS data safety guidance](https://digital.nhs.uk/data-and-information/keeping-data-safe-and-benefitting-the-public).
      options:
        - label: I confirm this request does not include PII/PID, or sensitive data
          required: true
