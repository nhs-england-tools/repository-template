name: New repository setup
description: Track the initial setup of a repository created from this template
title: "[Setup]: Complete repository setup"
body:
  - type: markdown
    attributes:
      value: |
        Open this issue in the new repository and assign it to a maintainer.
        Follow the [repository setup guide](https://github.com/nhs-england-tools/repository-template/blob/main/docs/guides/template/Set_up_a_new_repository.md) for detailed steps.
        Complete the checklist in an initial setup pull request before accepting contributions.
        Ask a maintainer and the relevant security or policy owner to review that pull request.
        Do not include private reports, personal data, or sensitive contact details in this issue.
  - type: checkboxes
    id: documentation
    attributes:
      label: Repository setup
      description: Check each item when complete. Record any approved exceptions to other items in the setup pull request.
      options:
        - label: Replace template repository URLs and support links in the README and issue forms with the new project's details.
        - label: Update the README with the project's configuration and contribution workflow.
        - label: Confirm the Code of Conduct reporting routes and escalation process with the responsible policy owner.
        - label: Confirm the security policy's scope, supported versions, private reporting route, and response process with the responsible security owner.
        - label: Tailor the contributing guide with the project's setup, tests, review rules, and release process.
        - label: Configure .github/CODEOWNERS to cover every file with at least one visible team from this organisation. Its teams must have at least two members between them, and each owner needs write access.
        - label: "Add a future review date to .github/CODEOWNERS in the format `# Review-by: YYYY-MM-DD`."
        - label: For a public repository, enable secret scanning, push protection and private vulnerability reporting, and confirm that security advisories are available. For a private or internal repository, enable secret scanning and push protection where the organisation's licence allows.
        - label: Protect the default branch with a ruleset that requires pull requests, code-owner approval and the CI checks, with a reviewed bypass list.
        - label: Confirm that the organisation's access policy for the six NHS_ release variables and secrets includes this repository. Do not create them in the repository.
        - label: Confirm that the release App is installed on this repository.
        - label: Allow squash merging only, with "Pull request title and description" as the default commit message.
        - label: "Require `🏷️ Check pull request title` as the only release-specific pull request check in the default branch ruleset, and add the release App to its bypass list with Always."
        - label: "For a merge queue, add a `merge_group` trigger to the pull request title check workflow and adapt the check for merge-group events before requiring it for the queue."
        - label: Require signed commits on the default branch in a separate ruleset with an empty bypass list, and tell contributors that unsigned branch commits can block a squash merge.
        - label: Add a ruleset on v* tags that restricts creations, updates and deletions, with only the release App in its bypass list.
        - label: Record applicable information governance, accessibility, security, and clinical safety requirements in the project documentation.
        - label: Resolve the documentation TODOs and verify that links and published contact routes work.
        - label: Implement the recipes for every TODO-marked target in the Makefile. Keep the existing target names.
        - label: Extend format, lint and test with project formatters, checks and fast tests. Keep the existing formatting, checks and Bash tests.
        - label: Review dependency sources, Dependabot, cooldown and update ownership using docs/guides/template/Update_Dependencies.md. Record project-specific changes.
        - label: Configure the required SonarQube Cloud integration using docs/guides/template/Configure_SonarQube_Cloud.md. Verify a pull request scan and quality gate result.
        - label: Configure the Power Automate flows and the TEAMS_NOTIFICATION_ALERTS_WEBHOOK_URL and TEAMS_NOTIFICATION_UPDATES_WEBHOOK_URL Actions secrets as recommended in docs/guides/template/Configure_pipeline_notifications.md. For a single channel, set only the alerts secret. Verify delivery for pipeline failures, recovery and release outcomes.
  - type: checkboxes
    id: approval
    attributes:
      label: Review before closing
      description: Keep this issue open until the setup pull request has the relevant approvals.
      options:
        - label: Confirm that the pull request and signed commits rulesets are active and target the default branch. Record the CODEOWNERS, security settings and ruleset results in the setup pull request, including a test pull request that the ruleset blocks and an invalid title that fails the title check.
        - label: A project maintainer has reviewed and approved the setup pull request.
        - label: The relevant security or policy owner has reviewed and approved the reporting routes, policies, security settings and ruleset.
  - type: input
    id: setup-pr
    attributes:
      label: Setup pull request
      description: Add a link to the setup pull request when one is open.
    validations:
      required: false
