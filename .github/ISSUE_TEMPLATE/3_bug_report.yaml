# See:
# - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
# - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
# - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/common-validation-errors-when-creating-issue-forms

name: 🐞 Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Report reproducible problems with this project. Do not report security vulnerabilities here. Do not include sensitive information.
  - type: checkboxes
    id: preflight
    attributes:
      label: Existing issues
      description: Please search existing issues before raising a new one.
      options:
        - label: I have searched the existing issues
          required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short summary of the bug.
      placeholder: e.g. make lint fails on macOS
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behaviour
      description: A concise description of what you are experiencing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: A concise description of what you expect to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest steps that reproduce the issue, or explain why you cannot reproduce it reliably.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Add relevant details only. Redact credentials and do not include personal data or PII/PID.
      value: |
        - OS:
        - Tool versions:
        - Runtime:
      render: markdown
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Project version or commit
      description: If known, provide a version, tag, or commit SHA.
      placeholder: e.g. v1.2.3 or abc1234
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant command output
      description: Optional. Redact credentials and do not include personal data or PII/PID. Output is formatted as code.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots that might help.
    validations:
      required: false
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the [Code of Conduct](https://github.com/nhs-england-tools/repository-template/blob/main/.github/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive information
      description: Please do not include credentials, PII/PID, or other sensitive data. See [NHS data safety guidance](https://digital.nhs.uk/data-and-information/keeping-data-safe-and-benefitting-the-public).
      options:
        - label: I confirm this report does not include PII/PID, or sensitive data
          required: true
