name: "Scan secrets"
description: "Scan secrets"
runs:
  using: "composite"
  steps:
    - name: "Scan secrets"
      shell: bash
      env:
        FORCE_USE_DOCKER: "true"
      run: |
        # Please do not change this `check=whole-history` setting, as new patterns may be added or history may be rewritten.
        make scan-secrets check=whole-history
