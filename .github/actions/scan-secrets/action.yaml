name: "Scan secrets"
description: "Scan secrets"
runs:
  using: "composite"
  steps:
    - name: "Scan secrets"
      shell: bash
      env:
        FORCE_USE_DOCKER: "true"
      run: |
        # Full-history scanning is intentional, so new patterns also cover earlier commits and rewritten history.
        make scan-secrets check=whole-history
