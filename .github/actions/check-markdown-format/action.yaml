name: "Check Markdown format"
description: "Check Markdown format"
runs:
  using: "composite"
  steps:
    - name: "Check Markdown format"
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        FORCE_USE_DOCKER: "true"
      run: |
        export BRANCH_NAME="origin/$DEFAULT_BRANCH"
        make check-markdown-format check=all
