version: 2

updates:
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    commit-message:
      prefix: "fix"
      include: "scope"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    commit-message:
      prefix: "ci"
      include: "scope"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    exclude-paths:
      - ".mise/**" # mise owns its lockfile sidecars
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directories:
      - "**/*"
    exclude-paths:
      - ".mise/**" # mise owns its lockfile sidecars
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
