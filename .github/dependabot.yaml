version: 2

updates:
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    exclude-paths:
      - ".mise/**" # mise owns its lockfile sidecars
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directories:
      - "**/*"
    exclude-paths:
      - ".mise/**" # mise owns its lockfile sidecars
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
