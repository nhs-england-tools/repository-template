version: 2

updates:
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
